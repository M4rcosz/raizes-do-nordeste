name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: adminuser
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexio_core
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adminuser -d nexio_core"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://adminuser:postgres@localhost:5432/nexio_core
      JWT_SECRET_KEY: test-secret-only-for-ci
      # The storage adapter calls getOrThrow on boot but makes no network call, so
      # dummies are enough to get the module graph up in e2e.
      SUPABASE_URL: https://ci.invalid
      SUPABASE_SECRET_KEY: sb_secret_only_for_ci
      SUPABASE_PRODUCT_IMAGE_BUCKET: product-images
      # Same reason: ai.module.spec compiles the real AiModule, whose Gemini adapter
      # calls getOrThrow in its constructor. No network call is made under test.
      # Without this the spec only passes locally, where ConfigModule reads .env.
      GEMINI_API_KEY: gemini-key-only-for-ci

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: E2E Test
        run: npm run test:e2e
